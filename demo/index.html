<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>seedrand demo</title>
    <style>
      body { font-family: ui-monospace, monospace; background: #101418; color: #eef2f6; max-width: 640px; margin: 48px auto; padding: 0 20px; }
      pre { background: #171d24; border: 1px solid #27313d; border-radius: 10px; padding: 14px; white-space: pre-wrap; }
      h1 span { color: #5ab0e0; }
      p { color: #8b99a8; }
    </style>
  </head>
  <body>
    <h1>seed<span>rand</span></h1>
    <p>Same seed, same sequence — reload this page and today's numbers don't change. Tomorrow they all re-roll.</p>
    <pre id="out"></pre>
    <script type="module">
      import { rng, dailySeed, hashSeed } from "../seedrand.js"
      const r = rng(dailySeed())
      document.getElementById("out").textContent = [
        `today's dailySeed: ${dailySeed()}`,
        `hashSeed("kakuro") = ${hashSeed("kakuro")}`,
        ``,
        `ints:   ${[...Array(8)].map(() => r.int(1, 99)).join("  ")}`,
        `shuffle: ${r.shuffle([1, 2, 3, 4, 5, 6, 7, 8]).join(" ")}`,
        `picks:  ${[...Array(6)].map(() => r.pick(["🥕", "🍅", "🎃"])).join(" ")}`,
        `chance(0.5) x10: ${[...Array(10)].map(() => (r.chance(0.5) ? "H" : "T")).join("")}`,
      ].join("\n")
    </script>
  </body>
</html>
